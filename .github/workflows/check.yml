name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  menubar:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
      - run: node --import tsx scripts/test-flows.ts tests/workflows/cli.test.ts tests/workflows/menubar.test.ts tests/workflows/bootstrap.test.ts

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
        with:
          browsers: "true"
      - run: npx next typegen
      - run: npm run check
      - run: npm test
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7

  realtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dependencies
        with:
          browsers: "true"
      - run: npx playwright test --config=playwright.realtime.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: realtime-failures
          path: test-results/
          retention-days: 7
