name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  menubar:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev
      - run: node --import tsx --test tests/pocket-cli.test.ts tests/menubar.test.ts

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev
      - run: npx next typegen
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7

  realtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.realtime.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: realtime-failures
          path: test-results/
          retention-days: 7
